<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Pulsebox — a local-first music player for your own library and streaming URLs."><title>Pulsebox · Music, in your hands</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><div class="app"><aside class="sidebar"><a class="brand" href="#"><span class="brand-mark">◉</span><span>pulsebox</span></a><nav><p class="nav-label">LIBRARY</p><button class="nav-item active" data-view="home"><span>⌂</span>Home</button><button class="nav-item" data-view="library"><span>▤</span>Your library</button><button class="nav-item" data-view="queue"><span>☷</span>Queue <b id="queueCount">0</b></button><p class="nav-label gap">YOUR SPACE</p><button class="nav-item" data-view="liked"><span>♡</span>Liked tracks</button><button class="nav-item" data-view="recent"><span>◷</span>Recently played</button></nav><div class="side-playlists"><div class="side-heading"><span>PLAYLISTS</span><button id="newPlaylist">＋</button></div><div id="playlistNav"></div></div><div class="sidebar-foot"><span class="local-dot"></span><span>Local-first mode</span><button id="settingsBtn" title="Settings">⚙</button></div></aside>
<main><header class="topbar"><div class="search-wrap"><span>⌕</span><input id="search" placeholder="Search songs, artists, albums…" autocomplete="off"></div><div class="top-actions"><button class="icon-btn" id="addUrl" title="Add streaming URL">＋ URL</button><button class="avatar">AD</button></div></header><section id="content" class="content"></section></main>
<footer class="player"><div class="now-playing"><div id="playerCover" class="cover tiny gradient-1">♪</div><div><strong id="playerTitle">Nothing playing</strong><span id="playerArtist">Choose a track to begin</span></div><button class="heart" id="playerLike">♡</button></div><div class="transport"><div class="transport-buttons"><button id="shuffle" title="Shuffle">⤨</button><button id="prev" title="Previous">↶</button><button class="play" id="play" title="Play">▶</button><button id="next" title="Next">↷</button><button id="repeat" title="Repeat">↻</button></div><div class="progress"><span id="currentTime">0:00</span><input id="progress" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div></div><div class="player-tools"><button id="queueBtn">☷</button><span>◖</span><input id="volume" type="range" min="0" max="1" step=".01" value=".78"></div></footer></div><dialog id="urlDialog"><button class="dialog-close" id="closeDialog">×</button><p class="eyebrow">ADD A STREAM</p><h2>Bring your own audio.</h2><p class="dialog-copy">Paste a direct audio URL. Pulsebox keeps the track metadata and playback in your browser.</p><label>Audio URL<input id="urlInput" type="url" placeholder="https://example.com/track.mp3"></label><label>Track title<input id="urlTitle" placeholder="Untitled stream"></label><label>Artist<input id="urlArtist" placeholder="Unknown artist"></label><button class="dialog-submit" id="saveUrl">Add to library</button></dialog><input id="localFiles" type="file" accept="audio/*" multiple hidden><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
